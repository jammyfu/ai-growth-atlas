name: Suggest a project
description: Propose a repository to track, or a category change
labels: [enhancement]
body:
  - type: input
    id: repo
    attributes: {label: Repository, description: "owner/name or URL"}
    validations: {required: true}
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [AI, Developer Tools, Security, Web / Frontend, Infrastructure, Design / Creative, Data]
    validations: {required: true}
  - type: textarea
    id: why
    attributes: {label: Why does it belong here?}
    validations: {required: true}
